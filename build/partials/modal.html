<!-- Tour booking modal -->
  <dialog class="tour-modal" id="tour-modal" aria-labelledby="tm-title">
    <form class="tm-form" id="tour-form" novalidate>
      <header class="tm-head">
        <div><h3 id="tm-title">Book this tour</h3><p id="tm-sub">Tour</p></div>
        <button type="button" class="tm-close" aria-label="Close" data-close>&times;</button>
      </header>
      <div class="tm-body">
        <div class="field-row">
          <div class="field"><label for="tm-name">Full name</label><input id="tm-name" name="name" type="text" autocomplete="name" required data-label="Name"></div>
          <div class="field"><label for="tm-phone">Phone</label><div class="phone-row"><select name="dial" aria-label="Country code" data-label="Dial code"><option value="+353">IE +353</option><option value="+44">UK +44</option><option value="+1">US/CA +1</option><option value="+61">AU +61</option><option value="+49">DE +49</option><option value="+33">FR +33</option><option value="+34">ES +34</option><option value="+39">IT +39</option><option value="+31">NL +31</option></select><input id="tm-phone" name="phone" type="tel" autocomplete="tel-national" placeholder="87 123 4567" required data-label="Phone"></div></div>
        </div>
        <div class="field"><label for="tm-email">Email</label><input id="tm-email" name="email" type="email" autocomplete="email" required data-label="Email"></div>
        <div class="field"><label for="tm-pickup">Pickup address</label><input id="tm-pickup" name="pickup" type="text" placeholder="Add pickup" data-places required data-label="Pickup"></div>
        <div class="field-row">
          <div class="field"><label for="tm-date">Tour date</label><input id="tm-date" name="date" type="date" required data-label="Tour date"></div>
          <div class="field"><label for="tm-time">Pickup time</label><input id="tm-time" name="time" type="time" required data-label="Pickup time"></div>
        </div>
        <div class="field-row">
          <div class="field field-pax">
            <label for="tm-adults">Adults</label>
            <div class="stepper">
              <button type="button" data-step="-1" aria-label="Fewer adults">−</button>
              <input id="tm-adults" name="adults" type="number" value="1" min="1" max="8" readonly data-label="Adults">
              <button type="button" data-step="1" aria-label="More adults">+</button>
            </div>
          </div>
          <div class="field field-pax">
            <label for="tm-children">Children under 12</label>
            <div class="stepper">
              <button type="button" data-step="-1" aria-label="Fewer children">−</button>
              <input id="tm-children" name="children" type="number" value="0" min="0" max="8" readonly data-label="Children">
              <button type="button" data-step="1" aria-label="More children">+</button>
            </div>
          </div>
        </div>
        <p class="pax-more" hidden>More than 8 of you? We can arrange extra vehicles. Add your group size in the notes and we'll quote for the whole group.</p>
        <details class="more-details">
          <summary>Add notes, Eircode or country</summary>
          <div class="field"><label for="tm-notes">Notes</label><textarea id="tm-notes" name="notes" rows="3" placeholder="Wheelchair access, child seats, places you'd love to stop" data-label="Notes"></textarea></div>
          <div class="field-row">
            <div class="field"><label for="tm-eircode">Eircode</label><input id="tm-eircode" name="eircode" type="text" placeholder="D02 X285" data-label="Eircode"></div>
            <div class="field"><label for="tm-country">Country</label><select id="tm-country" name="country" data-label="Country"><option>Ireland</option><option>United Kingdom</option><option>United States</option><option>Canada</option><option>Australia</option><option>Germany</option><option>France</option><option>Spain</option><option>Italy</option><option>Netherlands</option><option>Other</option></select></div>
          </div>
        </details>
        <div class="tm-summary">
          <div><span>Tour</span><strong id="tm-sum-tour">–</strong></div>
          <div><span>Passengers</span><strong id="tm-sum-pax">1</strong></div>
          <div class="tm-total"><span id="tm-sum-label">Total (per vehicle)</span><strong id="tm-sum-total">–</strong></div>
          <p>No payment now. We confirm availability and the price, and you pay on the day.</p>
        </div>
        <input class="form-honey" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="card-actions">
          <button type="submit" class="btn btn-primary" id="tm-send"><span class="send-label">Send booking request</span></button>
          <button type="button" class="btn btn-quiet btn-wa-quiet" id="tm-wa"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg><span>WhatsApp</span></button>
        </div>
        <p class="form-status" id="tm-status" role="status" aria-live="polite"></p>
      </div>
    </form>
  </dialog>
