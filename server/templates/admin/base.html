<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Admin{% endblock %} - BCH Taxi</title>
<link rel="stylesheet" href="/admin/static/admin.css">
</head>
<body>
{% block nav %}
<header class="top">
  <details class="nav">
    <summary>Menu</summary>
    <nav>
      <a href="/admin/">Dashboard</a>
      <a href="/admin/prices">Prices</a>
      <a href="/admin/tours">Tours</a>
      <a href="/admin/multi-day">Multi-day</a>
      <a href="/admin/photos">Photos</a>
      <a href="/admin/text">Text</a>
      <a href="/admin/contact">Contact</a>
      <form method="post" action="/admin/logout">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <button type="submit" class="link">Log out</button>
      </form>
    </nav>
  </details>
</header>
{% endblock %}
<main>
{% with messages = get_flashed_messages(with_categories=true) %}
{% for cat, msg in messages %}<p class="flash {{ cat }}" role="status">{{ msg }}</p>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>
</body>
</html>
