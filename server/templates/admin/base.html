<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Admin{% endblock %} - BCH Taxi</title>
<link rel="stylesheet" href="/admin/static/admin.css">
</head>
<body>
{% block nav %}
<header class="top">
  <details class="nav">
    <summary><span class="brand">BCH Taxi admin</span><span class="menu">Menu</span></summary>
    <nav>
      <a href="/admin/"{% if request.path in ('/admin','/admin/') %} aria-current="page"{% endif %}>Dashboard</a>
      <a href="/admin/prices"{% if request.path.startswith('/admin/prices') %} aria-current="page"{% endif %}>Prices</a>
      <a href="/admin/tours"{% if request.path.startswith('/admin/tours') %} aria-current="page"{% endif %}>Tours</a>
      <a href="/admin/multi-day"{% if request.path.startswith('/admin/multi-day') %} aria-current="page"{% endif %}>Multi-day</a>
      <a href="/admin/fleet"{% if request.path.startswith('/admin/fleet') %} aria-current="page"{% endif %}>Fleet</a>
      <a href="/admin/photos"{% if request.path.startswith('/admin/photos') %} aria-current="page"{% endif %}>Photos</a>
      <a href="/admin/text"{% if request.path.startswith('/admin/text') %} aria-current="page"{% endif %}>Text</a>
      <a href="/admin/contact"{% if request.path.startswith('/admin/contact') %} aria-current="page"{% endif %}>Contact</a>
      <form method="post" action="/admin/logout">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <button type="submit" class="link">Log out</button>
      </form>
    </nav>
  </details>
</header>
{% endblock %}
<main>
{% with messages = get_flashed_messages(with_categories=true) %}
{% for cat, msg in messages %}<p class="flash {{ cat }}" role="status">{{ msg }}</p>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>
<script>
(function(){var d=document.querySelector("details.nav");if(!d||!window.matchMedia)return;
var m=matchMedia("(min-width:900px)");function f(){if(m.matches)d.open=true;}f();
(m.addEventListener?m.addEventListener("change",f):m.addListener(f));})();
</script>
</body>
</html>
